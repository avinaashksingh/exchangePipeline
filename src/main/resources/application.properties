spring.application.name=exchangePipeline

# pipeline=INFO for business events; DEBUG shows per-message Kafka/book updates
logging.level.pipeline=INFO
logging.level.com.scetzhbook.exchangePipeline=INFO

# Actuator / Prometheus (scrape: GET /actuator/prometheus)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

# Kafka — matches docker-compose (localhost:9092)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.trusted.packages=com.scetzhbook.exchangePipeline.model
spring.kafka.producer.properties.max.block.ms=500

spring.kafka.consumer.group-id=exchange-pipeline-market-data
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.scetzhbook.exchangePipeline.model
spring.kafka.consumer.properties.spring.json.use.type.headers=true
