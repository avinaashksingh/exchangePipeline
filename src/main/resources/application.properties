spring.application.name=exchangePipeline

# Actuator / Prometheus (scrape: GET /actuator/prometheus)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

# Kafka — matches docker-compose (localhost:9092)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.trusted.packages=com.scetzhbook.exchangePipeline.model
