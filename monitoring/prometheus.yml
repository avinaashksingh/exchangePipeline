# Scrapes the app on the host (./mvnw spring-boot:run).
# Docker Desktop / Linux with host-gateway: host.docker.internal
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: exchange-pipeline
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          application: exchangePipeline
