# Infrastructure only (Kafka, Prometheus, Grafana).
# Run the Spring Boot app on the host for debugging:
#   docker compose up -d
#   ./mvnw spring-boot:run
#
# Optional containerized app:
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    container_name: exchange-pipeline-kafka
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: exchange-pipeline-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      kafka:
        condition: service_started

  grafana:
    image: grafana/grafana:11.4.0
    container_name: exchange-pipeline-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana-provisioning-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-provisioning-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/exchange-pipeline.json:ro
    depends_on:
      - prometheus
